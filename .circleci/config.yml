      - run:
          name: Restore vendored sources
          command: tar xf sources-basket.tar
      - run:
          name: Workspace summary
          command: free -m
      - run:
          name: Finalize build
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Stabilize
          command: ls -la
      - run:
          command: taskset -c 0-3 ./executor-nightly
